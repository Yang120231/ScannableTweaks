modLoader = "javafml"
loaderVersion = "[4,)"
license = "${mod_license}"
issueTrackerURL = "${mod_issues}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
displayURL = "${mod_homepage}"
description = '''
${mod_description}
'''
# Everything degrades gracefully: a client with this mod can join a server without it and
# simply gets Scannable's own packed-list behaviour back.
displayTest = "IGNORE_SERVER_VERSION"

[[mixins]]
config = "scannable_tweaks.mixins.json"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neoforge_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "1.21.1"
ordering = "NONE"
side = "BOTH"

# Needed on both sides: the GUI is client-side, but the slot layout is stored on the item
# and so has to be written by whichever side owns it.
[[dependencies.${mod_id}]]
modId = "scannable"
type = "required"
versionRange = "${scannable_version_range}"
ordering = "AFTER"
side = "BOTH"

# Drag-and-drop integrations only exist on the client, and all three recipe viewers are optional.
[[dependencies.${mod_id}]]
modId = "jei"
type = "optional"
versionRange = "${jei_version_range}"
ordering = "AFTER"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "roughlyenoughitems"
type = "optional"
versionRange = "${rei_version_range}"
ordering = "AFTER"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "emi"
type = "optional"
versionRange = "${emi_version_range}"
ordering = "AFTER"
side = "CLIENT"
