name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace

      - name: Read project metadata
        id: props
        shell: bash
        run: |
          mod_id="$(sed -n 's/^mod_id=//p' gradle.properties | tr -d '\r')"
          mod_version="$(sed -n 's/^mod_version=//p' gradle.properties | tr -d '\r')"
          short_sha="$(git rev-parse --short HEAD)"
          echo "mod_id=$mod_id" >> "$GITHUB_OUTPUT"
          echo "mod_version=$mod_version" >> "$GITHUB_OUTPUT"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.props.outputs.mod_id }}-${{ steps.props.outputs.mod_version }}-${{ steps.props.outputs.short_sha }}
          path: build/libs/${{ steps.props.outputs.mod_id }}-${{ steps.props.outputs.mod_version }}.jar
          retention-days: 7
