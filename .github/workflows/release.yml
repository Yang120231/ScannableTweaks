name: Publish to CurseForge

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew clean build --no-daemon --stacktrace

      - name: Read project version
        id: properties
        shell: bash
        run: |
          version="$(sed -n 's/^mod_version=//p' gradle.properties)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Publish to CurseForge
        uses: Kir-Antipov/mc-publish@v3.3.1
        with:
          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          files: build/libs/scannable_tweaks-${{ steps.properties.outputs.version }}.jar
          name: Scannable Tweaks ${{ steps.properties.outputs.version }} for Minecraft 1.21.1
          version: ${{ steps.properties.outputs.version }}
          version-type: ${{ github.event.release.prerelease && 'beta' || 'release' }}
          changelog: ${{ github.event.release.body }}

          loaders: neoforge
          game-versions: 1.21.1
          java: 21
          environment: client | server
          curseforge-dependencies: |
            scannable(required)
            jei(required)

          fail-mode: fail
