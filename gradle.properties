## Dependencies
# Scannable version range is deliberately loose: released versions carry a git-hash
# build suffix (e.g. "1.8.0+d42c576") which Maven ordering treats as a pre-release
# qualifier, so "[1.8.0,)" would reject the very build it names.
scannable_version=MC1.21.1-neoforge-1.8.0
scannable_version_range=[1.7,)
architectury_version=13.0.11
jei_version=19.43.0.395
jei_version_range=[19.0.0,)
